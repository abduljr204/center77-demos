<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Center 77 — مركز 77 للعناية بالسيارات (Demo)</title>
<meta name="description" content="Demo website concept for a car care center in Tripoli with WhatsApp booking.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <div class="wrap nav">
    <a class="logo" href="#top" aria-label="Center 77">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l12 14-12 14L4 16z" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M16 9l6 7-6 7-6-7z" fill="currentColor"/></svg>
      <span class="logo-name" id="logoName"></span>
      <small id="logoSub"></small>
    </a>
    <nav>
      <a class="l" href="#services" data-i18n="nav_services"></a>
      <a class="l" href="#gallery" data-i18n="nav_gallery"></a>
      <a class="l" href="#book" data-i18n="nav_book"></a>
      <button class="lang" id="langBtn" type="button" aria-label="Language">EN</button>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="photo" aria-hidden="true"></div>
    <div class="wrap hc">
      <span class="eyebrow" data-i18n="eyebrow"></span>
      <h1 data-i18n-html="h1"></h1>
      <p class="lead" data-i18n="lead"></p>
      <div class="cta">
        <a class="btn" href="#book" data-i18n="cta_book"></a>
        <a class="btn ghost" href="#services" data-i18n="cta_services"></a>
      </div>
    </div>
  </section>

  <section class="infoStrip"><div class="wrap strip">
    <div><b data-i18n="info_hours"></b><span id="infoHours"></span></div>
    <div><b data-i18n="info_location"></b><span id="infoCity"></span></div>
    <div><b data-i18n="info_whatsapp"></b><span id="infoPhone" dir="ltr"></span></div>
  </div></section>

  <section id="services"><div class="wrap">
    <p class="kick" data-i18n="svc_kick"></p>
    <h2 data-i18n="svc_title"></h2>
    <p class="sub" data-i18n="svc_sub"></p>
    <div class="svc" id="svcGrid"></div>
    <p class="note" data-i18n="svc_note"></p>
  </div></section>

  <section id="gallery" class="tight"><div class="wrap">
    <p class="kick" data-i18n="gal_kick"></p>
    <h2 data-i18n="gal_title"></h2>
    <div class="gal">
      <div class="g1"><span data-i18n="gal_1"></span></div>
      <div class="g2"><span data-i18n="gal_2"></span></div>
    </div>
    <p class="note" data-i18n="gal_note"></p>
  </div></section>

  <section id="book" class="tight"><div class="wrap">
    <div class="book">
      <div class="bookInfo">
        <p class="kick" data-i18n="book_kick"></p>
        <h2 data-i18n="book_title"></h2>
        <p class="sub" data-i18n="book_sub"></p>
        <ol class="steps">
          <li><b>1</b><span data-i18n="step1"></span></li>
          <li><b>2</b><span data-i18n="step2"></span></li>
          <li><b>3</b><span data-i18n="step3"></span></li>
        </ol>
      </div>

      <form id="bookForm" novalidate>
        <div>
          <label for="service" data-i18n="f_service"></label>
          <select id="service"></select>
        </div>
        <div class="row">
          <div>
            <label for="date" data-i18n="f_date"></label>
            <input id="date" type="date">
          </div>
          <div>
            <label for="name" data-i18n="f_name"></label>
            <input id="name" type="text" autocomplete="name">
          </div>
        </div>
        <div>
          <label data-i18n="f_time"></label>
          <div class="slots" id="slots" role="group"></div>
        </div>
        <p class="err" id="err" role="alert" hidden></p>
        <button class="btn wa" type="submit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.6-1.2.1-.2 0-.3 0-.5s-.6-1.4-.8-1.9-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c.6.3 1.1.4 1.5.5a3.6 3.6 0 0 0 1.7-.1 2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.2-.2-.5-.3z"/></svg>
          <span data-i18n="f_send"></span>
        </button>
        <p class="hint" data-i18n="f_hint"></p>
      </form>
    </div>
  </div></section>
</main>

<footer><div class="wrap" data-i18n="footer"></div></footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
